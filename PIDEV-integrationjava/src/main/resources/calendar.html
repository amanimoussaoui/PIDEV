<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier des Formations</title>
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
  <style>
    #calendar {
      width: 100%;
      height: 600px;
      padding: 10px;
    }
    .fc-daygrid-day-events {
      min-height: 40px;
    }
    .fc-event {
      background-color: #388E3C !important;
      border: none !important;
      padding: 2px 4px !important;
      margin: 1px 2px !important;
      cursor: pointer;
    }
    .fc-daygrid-day-number {
      font-weight: bold;
      padding: 4px;
    }
    .fc-day-today {
      background-color: #e8f5e9 !important;
    }
    .fc-daygrid-day.fc-day-has-events {
      background-color: #f1f8e9 !important;
    }
    .fc-event-title {
      font-weight: bold;
      font-size: 0.85em;
      white-space: normal !important;
    }
    .fc-event-participants {
      font-size: 0.75em;
      opacity: 0.9;
    }
    .fc-event-time {
      display: none;
    }
  </style>
</head>
<body>
<div id='calendar'></div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek'
      },
      locale: 'fr',
      firstDay: 1,
      dayMaxEventRows: 3,
      eventDisplay: 'block',
      eventContent: function(arg) {
        var parts = arg.event.title.split('|');
        var container = document.createElement('div');

        container.innerHTML = `
            <div class="fc-event-title">${parts[0] || ''}</div>
            ${parts[1] ? `<div class="fc-event-participants">${parts[1]}</div>` : ''}
          `;

        return { domNodes: [container] };
      }
    });

    calendar.render();

    window.addEvents = function(events) {
      console.log("Reception d'événements:", events);
      calendar.removeAllEvents();
      if (events && events.length > 0) {
        calendar.addEventSource(events);
      }
      calendar.refetchEvents();
    };
  });
</script>
</body>
</html>
