knp_paginator:
    page_range: 5                      # Number of pages displayed in the pagination menu
    default_options:
        page_name: page                # Page query parameter name
        sort_field_name: sort          # Sort field query parameter name
        sort_direction_name: direction # Sort direction query parameter name
        distinct: true                 # Ensure distinct results
    template:
        pagination: '@KnpPaginator/Pagination/twitter_bootstrap_v4_pagination.html.twig' # Use Bootstrap 4 pagination style