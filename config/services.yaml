# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration

parameters:
    photo_dir: "%kernel.project_dir%/public/uploads/images"
    uploads_dir: "%kernel.project_dir%/public/uploads"
    twilio_sid: '%env(TWILIO_SID)%'
    twilio_auth_token: '%env(TWILIO_AUTH_TOKEN)%'
    twilio_phone_number: '%env(TWILIO_PHONE_NUMBER)%'
    stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
    stripe_public_key: '%env(STRIPE_PUBLIC_KEY)%'
    google_maps_api_key: '%env(GOOGLE_MAPS_API_KEY)%'
    openai.api_key: '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'


    


services:
    App\Service\StripeService:
        arguments:
            $secretKey: '%stripe_secret_key%'
   

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
    App\Service\PdfGeneratorService:
        autowire: true
        autoconfigure: true

    # Service definition for SmsService
    App\Service\SmsService:
        arguments:
            $twilioSid: '%twilio_sid%'
            $twilioToken: '%twilio_auth_token%'
            $twilioNumber: '%twilio_phone_number%'
    App\Service\OpenAIService:
        arguments:
            $apiKey: '%env(OPENAI_API_KEY)%'
           
            
   
