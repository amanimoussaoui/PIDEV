<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier des Activités</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../../css/calendar.css" rel="stylesheet">
</head>
<body>
<div id="calendar-container">
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Chargement du calendrier...</div>
    </div>
    <div id="calendar-wrapper">
        <div id="calendar"></div>
    </div>
    <div class="calendar-legend">
        <div class="legend-item">
            <div class="legend-color" style="background-color: var(--secondary-color);"></div>
            <span>Semis</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: var(--blue-color);"></div>
            <span>Arrosage</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: var(--accent-color);"></div>
            <span>Fertilisation</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: var(--primary-color);"></div>
            <span>Récolte</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: var(--warning-color);"></div>
            <span>Traitement</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: var(--purple-color);"></div>
            <span>Désherbage</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: var(--danger-color);"></div>
            <span>Autre</span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/fr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    function callJavaFX(action, param) {
        if (!window.javafx) {
            console.error("JavaFX bridge not available yet");
            setTimeout(() => callJavaFX(action, param), 100);
            return;
        }

        try {
            switch(action) {
                case 'showDetails':
                    window.javafx.callShowActivityDetails(param);
                    break;
                case 'edit':
                    window.javafx.callEditActivity(param);
                    break;
                case 'delete':
                    window.javafx.callDeleteActivity(param);
                    break;
                case 'add':
                    window.javafx.callAddActivity(param);
                    break;
            }
        } catch (e) {
            console.error("Error calling JavaFX:", e);
        }
    }

    // Vérifiez que cette fonction est bien présente dans votre HTML
    function hideLoading() {
        if (window.javafx && typeof window.javafx.log === 'function') {
            document.getElementById('loading-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading-overlay').style.display = 'none';
            }, 300); // Match this with the CSS transition time
        } else {
            setTimeout(hideLoading, 100);
        }
    }
    // Start checking for JavaFX bridge immediately
    hideLoading();

    window.bridgeState = {
        ready: false,
        queue: []
    };

    // Bridge ready check
    function checkBridgeReady() {
        if (typeof window.javafx !== 'undefined' &&
            typeof window.javafx.ping === 'function') {
            window.bridgeState.ready = true;
            window.javafx.ping();
            processQueue();
        } else {
            setTimeout(checkBridgeReady, 100);
        }
    }

    // Process queued actions
    function processQueue() {
        while (window.bridgeState.queue.length > 0) {
            const action = window.bridgeState.queue.shift();
            executeBridgeAction(action.type, action.data);
        }
    }

    // Execute or queue action
    function executeOrQueueAction(type, data) {
        if (window.bridgeState.ready) {
            executeBridgeAction(type, data);
        } else {
            window.bridgeState.queue.push({type, data});
        }
    }

    // Safe execution
    function executeBridgeAction(type, data) {
        try {
            switch(type) {
                case 'showDetails':
                    window.javafx.callShowActivityDetails(data);
                    break;
                case 'edit':
                    window.javafx.callEditActivity(data);
                    break;
                case 'delete':
                    window.javafx.callDeleteActivity(data);
                    break;
                case 'add':
                    window.javafx.callAddActivity(data);
                    break;
            }
        } catch (e) {
            console.error("Bridge action failed:", e);
            // Optionally retry or show error
        }
    }

    // Initialize check
    checkBridgeReady();

    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'fr',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: '' // Removed view switching buttons
                },
                height: '100%',
                aspectRatio: 1.5,
                events: window.calendarEvents || [],
                eventClick: function(info) {
                    const eventType = info.event.classNames[0] || 'Autre';
                    const eventDate = info.event.start.toLocaleDateString('fr-FR', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    // Get the activity ID from the event
                    const activityId = info.event.id;

                    Swal.fire({
                        title: info.event.title,
                        html: `
            <div class="activity-details">
                <p><strong>Date:</strong> ${eventDate}</p>
                <p><strong>Type:</strong> <span class="activity-type ${eventType}">${eventType}</span></p>
                <p><strong>Description:</strong> ${info.event.extendedProps.description || 'Aucune description'}</p>
            </div>
        `,
                        icon: 'info',
                        showConfirmButton: false,
                        showCloseButton: true,
                        footer: `
         <div class="activity-actions">
    <button id="btn-details" class="modern-action-button view-button">
        <i class="fas fa-info-circle"></i> Détails
    </button>
    <button  id="btn-edit"  class="modern-action-button edit-button">
        <i class="fas fa-edit"></i> Modifier
    </button>
    <button  id="btn-delete" class="modern-action-button delete-button">
        <i class="fas fa-trash"></i> Supprimer
    </button>
</div>

        `
                    });
                    document.getElementById('btn-details').addEventListener('click', function() {
                        const activityId = info.event.id;
                        executeOrQueueAction('showDetails', info.event.id);
                        callJavaFX('showDetails', activityId);
                        console.log("Details button clicked for activity ID: " + activityId);

                        // Test if JavaFX bridge exists and functions are available
                        console.log("JavaFX bridge exists: " + (window.javafx !== undefined));
                        console.log("callShowActivityDetails function exists: " +
                            (window.javafx && typeof window.javafx.callShowActivityDetails === 'function'));

                        if (window.javafx && typeof window.javafx.callShowActivityDetails === 'function') {
                            try {
                                console.log("Calling JavaFX.callShowActivityDetails");
                                window.javafx.log("About to call showActivityDetails with ID: " + activityId);
                                window.javafx.callShowActivityDetails(activityId);
                                console.log("Call to JavaFX completed");
                            } catch (e) {
                                console.error("Error calling JavaFX showActivityDetails: ", e);
                            }
                        } else {
                            console.error("JavaFX bridge or function not available");
                        }

                        Swal.close();

                    });

                    document.getElementById('btn-edit').addEventListener('click', function() {
                        console.log("Edit button clicked for activity ID: " + activityId);
                        Swal.close();

                        if (window.javafx && typeof window.javafx.callEditActivity === 'function') {
                            try {
                                window.javafx.callEditActivity(activityId);
                            } catch (e) {
                                console.error("Error calling JavaFX editActivity: ", e);
                            }
                        } else {
                            console.error("JavaFX bridge or editActivity function not available");
                        }
                    });

                    document.getElementById('btn-delete').addEventListener('click', function() {
                        console.log("Delete button clicked for activity ID: " + activityId);
                        Swal.close();

                        if (window.javafx && typeof window.javafx.callDeleteActivity === 'function') {
                            try {
                                window.javafx.callDeleteActivity(activityId);
                            } catch (e) {
                                console.error("Error calling JavaFX deleteActivity: ", e);
                            }
                        } else {
                            console.error("JavaFX bridge or deleteActivity function not available");
                        }
                    });
                },


                dateClick: function(info) {
                    const formattedDate = new Date(info.dateStr).toLocaleDateString('fr-FR', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    Swal.fire({
                        title: `Nouvelle Activité`,
                        html: `
        <div class="activity-details">
            <p><strong>Date sélectionnée:</strong> ${formattedDate}</p>
            <p>Souhaitez-vous ajouter une nouvelle activité pour cette date?</p>
        </div>
        `,
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonText: 'Ajouter',
                        cancelButtonText: 'Annuler'
                    }).then((result) => {
                        console.log("Dialog result: " + (result.isConfirmed ? "confirmed" : "canceled"));

                        if (result.isConfirmed) {
                            console.log("Attempting to call JavaFX bridge");
                            console.log("JavaFX available: " + (window.javafx !== undefined));

                            if (window.javafx) {
                                try {
                                    // Format the date as yyyy-MM-dd for Java
                                    const isoDate = info.dateStr;
                                    console.log("Calling JavaFX.callAddActivity with date: " + isoDate);

                                    // Direct call with simple string parameter
                                    window.javafx.callAddActivity(isoDate);
                                } catch (e) {
                                    console.error("Error calling JavaFX bridge: ", e);
                                    alert("Error communicating with application: " + e.toString());
                                }
                            } else {
                                console.error("JavaFX bridge is not available");
                                alert("JavaFX bridge is not available");
                            }
                        }
                    });
                },
                dayMaxEvents: true,
                fixedWeekCount: false,
                firstDay: 1,
                showNonCurrentDates: false
            });

            calendar.render();
            window.calendarInstance = calendar;
            window.dispatchEvent(new Event('resize'));
        }, 100);
    });

    window.updateCalendarEvents = function(eventsJson) {
        try {
            const events = JSON.parse(eventsJson);
            if (window.calendarInstance) {
                window.calendarInstance.removeAllEvents();
                window.calendarInstance.addEventSource(events);
            } else {
                window.calendarEvents = events;
            }
        } catch (e) {
            console.error("Error updating calendar events:", e);
        }
    };

    window.addEventListener('resize', function() {
        if (window.calendarInstance) {
            window.calendarInstance.updateSize();
        }
    });
</script>
</body>
</html>
