<!DOCTYPE html>
<html>
<head>
  <title>Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 300%;
      width: 300%;
    }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  if (!L) {
    console.error("Leaflet library not loaded correctly.");
  } else {
    var map = L.map('map').setView([36.8065, 10.1815], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    var marker = null;

    map.on('click', function(e) {
      if (marker) {
        map.removeLayer(marker);
      }

      marker = L.marker(e.latlng).addTo(map)
              .bindPopup("Position sélectionnée: " + e.latlng.lat.toFixed(6) + ", " + e.latlng.lng.toFixed(6))
              .openPopup();

      if (window.javaConnector && typeof window.javaConnector.setCoordinates === 'function') {
        window.javaConnector.setCoordinates(e.latlng.lat, e.latlng.lng);
      } else {
        console.error("Java connector not available!");
      }
    });

    function setMarker(lat, lng) {
      if (marker) {
        map.removeLayer(marker);
      }
      marker = L.marker([lat, lng]).addTo(map);
      map.setView([lat, lng], 15);
    }

    window.javaConnector = {
      setCoordinates: function(lat, lng) {
        console.log("Coordinates sent to Java:", lat, lng);
      }
    };
  }
</script>
</body>
</html>
