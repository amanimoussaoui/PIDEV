<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Carte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([36.8065, 10.1815], 13);

  // ✅ Tuiles CartoDB (plus compatibles en WebView)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/">CartoDB</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  var marker = null;

  map.on('click', function(e) {
    if (marker) map.removeLayer(marker);
    marker = L.marker(e.latlng).addTo(map)
            .bindPopup("Position sélectionnée : " + e.latlng.lat.toFixed(6) + ", " + e.latlng.lng.toFixed(6))
            .openPopup();

    if (window.javaConnector && typeof window.javaConnector.setCoordinates === 'function') {
      window.javaConnector.setCoordinates(e.latlng.lat, e.latlng.lng);
    } else {
      console.error("Java connector not available!");
    }
  });

  function setMarker(lat, lng) {
    if (marker) map.removeLayer(marker);
    marker = L.marker([lat, lng]).addTo(map);
    map.setView([lat, lng], 15);
  }

  // Simule la présence du connecteur Java (à remplacer côté Java)
  window.javaConnector = {
    setCoordinates: function(lat, lng) {
      console.log("Coordinates sent to Java:", lat, lng);
    }
  };
</script>
</body>
</html>
